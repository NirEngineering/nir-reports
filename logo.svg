<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- White background -->
  <rect width="500" height="500" fill="white"/>

  <!-- Icon: two overlapping architectural rectangles (dark slate) -->
  <!-- Back rectangle (offset up-right) -->
  <rect x="60" y="110" width="145" height="175" fill="none" stroke="#4a5568" stroke-width="6"/>
  <!-- Front rectangle (offset down-left, filled) -->
  <rect x="30" y="145" width="145" height="175" fill="#4a5568"/>

  <!-- Architectural lines over front rect (white, thin) -->
  <!-- Diagonal 1: top-left to bottom-right -->
  <line x1="30" y1="145" x2="175" y2="320" stroke="white" stroke-width="2.5"/>
  <!-- Diagonal 2: top-right to bottom-left -->
  <line x1="175" y1="145" x2="30" y2="320" stroke="white" stroke-width="2.5"/>
  <!-- Vertical center -->
  <line x1="102" y1="145" x2="102" y2="320" stroke="white" stroke-width="2"/>

  <!-- Corner cross lines extending outside top-right -->
  <line x1="140" y1="110" x2="205" y2="65" stroke="#4a5568" stroke-width="3.5"/>
  <line x1="205" y1="110" x2="205" y2="65" stroke="#4a5568" stroke-width="3.5"/>
  <line x1="205" y1="65" x2="205" y2="145" stroke="#4a5568" stroke-width="3.5"/>

  <!-- Hebrew text: ניר הנדסה – large bold -->
  <!-- No direction="rtl" needed – Hebrew Unicode chars render RTL automatically via BiDi -->
  <text x="460" y="235" font-family="Arial, sans-serif" font-size="88" font-weight="bold"
        fill="#4a5568" text-anchor="end">ניר הנדסה</text>

  <!-- Subtitle line 1 -->
  <text x="460" y="285" font-family="Arial, sans-serif" font-size="30"
        fill="#718096" text-anchor="end">הנדסה אזרחית, מבנים, בטיחות</text>

  <!-- Subtitle line 2 -->
  <text x="460" y="320" font-family="Arial, sans-serif" font-size="25"
        fill="#a0aec0" text-anchor="end">תכנון  |  פיקוח  |  ניהול  |  ייעוץ הנדסי</text>
</svg>
